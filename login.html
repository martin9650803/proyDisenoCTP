<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Futurista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-login">
        <h2>INICIAR SESIÓN</h2>
        <p class="subtitulo">Acceso al Sistema Central</p>

        <form>
            <div class="grupo-campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre" required>
            </div>

            <div class="grupo-campo">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" placeholder="Tus apellidos" required>
            </div>

            <div class="grupo-campo">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="usuario@red.com" required>
            </div>

            <div class="grupo-campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn-enviar">Ingresar</button>
        </form>
    </div>

</body>
</html>
